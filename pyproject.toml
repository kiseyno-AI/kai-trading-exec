[project]
name = "kai-trading-exec"
version = "0.1.0"
description = "Execution runtime for KAI trading"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.16.0",
  "fastapi>=0.116.0",
  "pydantic>=2.11.0",
  "psycopg[binary]>=3.2.0",
  "sqlalchemy>=2.0.0",
  "uvicorn[standard]>=0.35.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28.0",
  "pytest>=8.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["apps/api"]
testpaths = ["tests"]
